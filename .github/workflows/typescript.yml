name: typescript

on:
  push:
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "services/**"
      - "apps/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "services/**"
      - "apps/**"
      - ".github/workflows/typescript.yml"

jobs:
  policy-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: outlay_test
          POSTGRES_USER: outlay
          POSTGRES_PASSWORD: outlay_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outlay -d outlay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://outlay:outlay_ci_password@localhost:5432/outlay_test
      PGSSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build shared policy package
        run: pnpm --filter @outlay/policy build
      - name: Typecheck policy service
        run: pnpm --filter @outlay/policy typecheck
      - name: Test policy service
        run: pnpm --filter @outlay/policy test
      - name: Build API
        run: pnpm --filter @outlay/api build
      - name: Typecheck API
        run: pnpm --filter @outlay/api typecheck
      - name: Apply API database migration
        run: pnpm --filter @outlay/api migrate
      - name: Test API
        run: pnpm --filter @outlay/api test
      - name: Test dashboard RPC adapter
        run: pnpm --filter @outlay/dashboard test
      - name: Build API container image
        run: docker build -t outlay-api:ci .
      - name: Boot API container and verify health
        run: |
          docker run -d --name outlay-api-ci --network host \
            -e DATABASE_URL=postgresql://outlay:outlay_ci_password@127.0.0.1:5432/outlay_test \
            -e PGSSL=disable \
            -e OUTLAY_ADMIN_TOKEN=ci-only-admin-token-0123456789abcdef0123456789abcdef \
            -e PORT=8787 outlay-api:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/health; then
              docker rm -f outlay-api-ci
              exit 0
            fi
            sleep 1
          done
          docker logs outlay-api-ci
          docker rm -f outlay-api-ci
          exit 1
